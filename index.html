<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมุดโทรศัพท์ รพ.กองบิน ๔๑</title>

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F5F0E8;
    --cream2: #FFFDF8;
    --brown-dark: #3A2810;
    --brown-mid: #7B4F2E;
    --brown-light: #C49A6C;
    --brown-pale: #E8D5B0;
    --brown-ultra: #F0E8D5;
    --green-dark: #4A5C2E;
    --green-mid: #5C6B3A;
    --green-light: #F0F5E0;
    --pink: #C4387A;
    --pink-bg: #FDE8F2;
    --blue-dark: #2E4A5C;
    --orange-dark: #5C3A1E;
  }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--cream);
    color: var(--brown-dark);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--green-mid);
    padding: 1.5rem 2rem;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header .logo {
    width: 48px; height: 48px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #fff;
    flex-shrink: 0;
  }
  header h1 { font-size: 20px; font-weight: 600; color: #fff; }
  header p { font-size: 13px; color: rgba(255,255,255,0.75); margin-top: 2px; }

  /* MAIN */
  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

  /* SEARCH */
  .search-wrap {
    position: relative;
    margin-bottom: 1.25rem;
  }
  .search-wrap svg {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px; color: var(--brown-light);
  }
  .search-wrap input {
    width: 100%;
    padding: 14px 16px 14px 48px;
    border-radius: 14px;
    border: 2px solid var(--brown-pale);
    background: var(--cream2);
    font-family: 'Sarabun', sans-serif;
    font-size: 15px;
    color: var(--brown-dark);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--brown-light); }
  .search-wrap input::placeholder { color: #B8A080; }

  /* TABS */
  .tabs {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .tab {
    padding: 7px 18px;
    border-radius: 20px;
    border: 1.5px solid var(--brown-pale);
    background: var(--cream2);
    font-family: 'Sarabun', sans-serif;
    font-size: 13px;
    color: var(--brown-mid);
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab:hover { border-color: var(--brown-light); }
  .tab.active {
    background: var(--green-mid);
    color: #fff;
    border-color: var(--green-mid);
    font-weight: 500;
  }

  /* SECTION */
  .section { margin-bottom: 1.75rem; }
  .sec-header {
    display: flex; align-items: center; gap: 10px;
    background: var(--green-mid);
    color: var(--green-light);
    padding: 12px 18px;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .sec-header.cert { background: #2E4A5C; }
  .sec-header.prov { background: #5C3A2E; }
  .sec-header.staff { background: #5C4A2E; }
  .sec-header svg { width: 20px; height: 20px; flex-shrink: 0; }
  .sec-title { font-size: 15px; font-weight: 500; flex: 1; }
  .sec-count {
    background: rgba(255,255,255,0.22);
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 10px;
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 10px;
  }

  /* CARD */
  .card {
    background: var(--cream2);
    border: 2px solid var(--brown-pale);
    border-radius: 14px;
    padding: 16px;
    position: relative;
    transition: border-color 0.15s, transform 0.1s;
  }
  .card:hover {
    border-color: var(--brown-light);
    transform: translateY(-2px);
  }
  .card-num {
    position: absolute; top: 12px; right: 14px;
    font-size: 11px; color: #C4A882; font-weight: 500;
  }
  .rank-pill {
    display: inline-block;
    background: var(--brown-ultra);
    color: var(--brown-mid);
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .card-name {
    font-size: 15px; font-weight: 600;
    color: var(--brown-dark);
    line-height: 1.35;
    margin-bottom: 5px;
    padding-right: 24px;
  }
  .card-nick {
    font-size: 13px; color: #8B6A40;
    display: flex; align-items: center; gap: 5px;
    margin-bottom: 12px;
  }
  .card-nick::before { content: '•'; color: var(--brown-light); }

  .phone-btn {
    display: flex; align-items: center; gap: 8px;
    background: var(--pink-bg);
    border-radius: 9px;
    padding: 9px 12px;
    font-size: 13px; font-weight: 500;
    color: var(--pink);
    text-decoration: none;
    transition: background 0.15s;
    margin-top: 6px;
  }
  .phone-btn:first-of-type { margin-top: 0; }
  .phone-btn:hover { background: #f9d0e8; }
  .phone-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* NO RESULT */
  .no-result {
    text-align: center; padding: 3rem;
    color: #B8A080; font-size: 15px;
    grid-column: 1/-1;
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 12px;
    color: #B8A080;
    border-top: 1px solid var(--brown-pale);
    margin-top: 1rem;
  }

  @media (max-width: 600px) {
    header { padding: 1rem 1.25rem; }
    .grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 400px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>

function setTab(t, el) {
  activeTab = t;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const container = document.getElementById('results');

  let filtered = data.filter(p => {
    const mTab = activeTab === 'all' || p.g === activeTab;
    const mQ = !q || p.name.toLowerCase().includes(q) || p.nick.toLowerCase().includes(q)
      || p.rank.toLowerCase().includes(q) || p.phones.some(ph => ph.includes(q));
    return mTab && mQ;
  });

  if (!filtered.length) {
    container.innerHTML = '<p style="text-align:center;padding:3rem;color:#B8A080;">ไม่พบรายชื่อที่ค้นหา</p>';
    return;
  }

  const order = ['doctor', 'cert', 'prov', 'staff'];
  const sections = {};
  filtered.forEach(p => { if (!sections[p.g]) sections[p.g] = []; sections[p.g].push(p); });

  let num = 0;
  let html = '';
  order.forEach(gk => {
    if (!sections[gk]) return;
    const persons = sections[gk];
    const m = secMeta[gk];
    html += `<div class="section">
      <div class="sec-header ${m.cls}">${m.icon}<span class="sec-title">${persons[0].s}</span><span class="sec-count">${persons.length} คน</span></div>
      <div class="grid">`;
    persons.forEach(p => {
      num++;
      const phoneHtml = p.phones.map(ph =>
        `<a class="phone-btn" href="tel:${ph.replace(/[-\s]/g,'')}">${phoneIcon}${ph}</a>`
      ).join('');
      html += `<div class="card">
        <span class="card-num">#${num}</span>
        <div class="rank-pill">${p.rank}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-nick">${p.nick}</div>
        ${phoneHtml}
      </div>`;
    });
    html += '</div></div>';
  });

  container.innerHTML = html;
}

render();
</script>
</body>
</html>
